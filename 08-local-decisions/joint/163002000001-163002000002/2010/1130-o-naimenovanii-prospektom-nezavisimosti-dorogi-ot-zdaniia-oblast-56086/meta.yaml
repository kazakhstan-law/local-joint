requisite: Постановление акимата города Актау Мангистауской области от 30 ноября 2010 года № 1147 и решение Актауского городского маслихата Мангистауской области от 30 ноября 2010 года №37/334. Утратило силу постановлением акимата города Актау Мангистауской области от 11 марта 2016 года № 409 и решением Актауского городского маслихата Мангистауской области от 11 марта 2016 года № 38/384.
title:
  rus: О наименовании "Проспектом Независимости" дороги от здания областного акимата, расположенного в 14 микрорайоне города Актау, до трассы "Актау-Бейнеу"
  kaz: Ақтау қаласы 14 шағын ауданында орналасқан облыстық әкімдік ғимаратынан бастап "Ақтау - Бейнеу" тас жолына дейінгі аралықтағы жолды "Тәуелсіздік даңғылы" деп атау туралы
