  title:
    rus: О внесении изменения в совместные постановление акимата района Шал акына Северо-Казахстанской области от 21 ноября 2016 года № 236 и решение маслихата района Шал акына Северо-Казахстанской области от 21 ноября 2016 года № 8/3 «О переименовании улицы города Сергеевки района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданы Сергеевка қаласы көшесінің атауын өзгерту туралы» Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2016 жылғы 21 қарашадағы № 236 бірлескен қаулысына және Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының 2016 жылғы 21 қарашадағы № 8/3 шешіміне өзгерту енгізу туралы
