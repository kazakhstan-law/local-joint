    kaz: Ақмола облысының әкімшілік-аумақтық құрылысындағы өзгерістер туралы Ақмола облысы әкімінің және Ақмола облыстық мәслихатының кейбір бірлескен  шешімдеріне, Ақмола облысы әкімдігінің қаулылары мен Ақмола облыстық мәслихатының шешімдеріне өзгерістер енгізу туралы
