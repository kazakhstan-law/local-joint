  requisite: Совместное постановление акимата Кызылжарского района Северо-Казахстанской области от 26 ноября 2018 года № 450 и решение Кызылжарского районного маслихата Северо-Казахстанской области от 26 ноября 2018 года № 34/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 ноября 2018 года № 5020
  title:
    rus: О внесении изменений в совместное постановление акимата Кызылжарского района Северо-Казахстанской области от 10 ноября 2010 года № 443 и решение Кызылжарского районного маслихата Северо-Казахстанской области от 17 ноября 2010 года № 29/18 «Об изменении границ аула Байтерек Кызылжарского сельского округа и села Подгорное Кызылжарского сельского округа Кызылжарского района»
    kaz: Солтүстік Қазақстан облысы Қызылжар аудандық әкімдігінің 2010 жылғы 10 қарашадағы № 443 және Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2010 жылғы 17 қарашадағы № 29/18 «Қызылжар ауданы Қызылжар селолық округі Бәйтерек ауылы және Қызылжар селолық округі Подгорное селосының шекараларын өзгерту туралы» біріккен қаулысы мен шешіміне өзгерістер енгізу туралы
