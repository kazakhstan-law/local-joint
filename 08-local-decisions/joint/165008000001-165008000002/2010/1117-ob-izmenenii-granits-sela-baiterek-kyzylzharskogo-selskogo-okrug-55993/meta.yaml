act_code: '55993'
requisite: Совместное постановление акимата Кызылжарского района Северо-Казахстанской области от 10 ноября 2010 года № 443 и решение маслихата Кызылжарского района Северо-Казахстанской области от 17 ноября 2010 года № 29/18. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 21 декабря 2010 года № 13-8-135
title:
  rus: Об изменении границ села Байтерек Кызылжарского сельского округа и села Подгорное Кызылжарского сельского округа Кызылжарского района
  kaz: Қызылжар ауданы Қызылжар ауылдық округі Бәйтерек ауылы және Қызылжар ауылдық округі Подгорное ауылының шекараларын өзгерту туралы
