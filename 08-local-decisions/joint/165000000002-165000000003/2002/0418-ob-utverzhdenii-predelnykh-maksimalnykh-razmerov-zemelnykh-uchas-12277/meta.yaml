act_code: '12277'
requisite: Совместное решение Северо-Казахстанского областного маслихата и акима Северо-Казахстанской области от 19 апреля 2002 года № 17/6-3. Зарегистрировано Управлением юстиции Северо-Казахстанской области 24 мая 2002 года за № 648. Утратило силу - совместным постановлением акимата Северо-Казахстанской области от 23 июля 2010 года № 196 и решением маслихата Северо-Казахстанской области от 23 июля 2010 года № 27/11
title:
  rus: Об утверждении предельных (максимальных) размеров земельных участков, которые могут находиться в собственности граждан и в долгосрочном землепользовании для ведения товарного сельскохозяйственного производства
  kaz: Азаматтардың меншігіне берілетін және ауыл шаруашылық өндірісін жүргізу үшін ұзақ мерзімді жер пайдалануда болуы мүмкін жер учаскелерінің шекті (ең үлкен) мөлшерін бекіту туралы
