  title:
    rus: О признании утратившим силу п.2 совместного решения областного маслихата и акима области № 17/6-3 "Об утверждении предельных (максимальных) размеров земельных участков, которые могут находиться в собственности граждан и в долгосрочном землепользовании для ведения товарного (сельскохозяйственного) производства."
    kaz: Облыстық мәслихаттың және облыс әкімінің "Тауарлы (ауыл шаруашылығы) өндiрiсiн жүргiзу үшiн азаматтардың меншiгiнде бола алатын және ұзақ мерзiмде пайдалана алатын жер учаскелерiнiң шектеулi (ең үлкен) мөлшерiн бекіту туралы" № 17/6-3 бірлескен шешімінiң 2-тармағы күшiн жойды деп тану туралы
